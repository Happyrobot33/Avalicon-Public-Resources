name: Publish data.json

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}data.json
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: python3 -m json.tool data.json > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build atlas and site
        run: |
          pip install pillow
          python scripts/build_atlas.py --data data.json --images images --out _site

      - name: Sort published performers by start time
        run: |
          python3 <<'EOF'
          import json
          from pathlib import Path

          path = Path("_site/data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["performers"].sort(key=lambda performer: performer["startTime"])
          path.write_text(json.dumps(data, indent=4, ensure_ascii=False) + "\n", encoding="utf-8")
          EOF

      - name: Build editor
        run: |
          mkdir _site/editor
          cp editor/index.html _site/editor/
          cp -r editor/js _site/editor/js
          # Source logos, used by the editor's card previews (../images/...).
          cp -r images _site/images
          npx --yes sass --no-source-map editor/styles.scss _site/editor/styles.css

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
